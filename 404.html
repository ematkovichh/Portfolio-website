<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Eugen Matković</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      background:#000;color:#fff;min-height:100vh;
      font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:24px;padding:24px;text-align:center;
    }
    .code{
      font-size:clamp(4rem,18vw,9rem);font-weight:600;letter-spacing:-.02em;
      line-height:1;color:#ebebeb;
    }
    .msg{font-size:15px;color:rgba(255,255,255,.55);line-height:1.7;max-width:26rem}
    .home{
      display:inline-flex;align-items:center;gap:10px;margin-top:8px;
      border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.03);
      border-radius:999px;padding:10px 20px;font-size:.7rem;text-transform:uppercase;
      letter-spacing:.18em;color:rgba(255,255,255,.7);text-decoration:none;transition:.3s;
    }
    .home:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff}
  </style>
</head>
<body>
  <div class="code">404</div>
  <p class="msg">This page doesn't exist — or it did, and I redesigned it out of existence.</p>
  <a class="home" href="/">Back to the portfolio</a>
</body>
</html>
