<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#030308;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ── Neon Math Visualization ───────────────────────────────────────────────
   Unit circle → Euler's formula → sine / cosine projection
   Neon palette, canvas glow via shadowBlur, 60fps RAF loop
──────────────────────────────────────────────────────────────────────────── */

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// DPR-aware resize
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W   = canvas.offsetWidth;
  H   = canvas.offsetHeight;
  canvas.width  = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ── Palette ─────────────────────────────────────────────────────────────── */
const BG     = '#030308';
const PURPLE = '#a855f7';
const CYAN   = '#22d3ee';
const PINK   = '#f472b6';
const WHITE  = 'rgba(255,255,255,0.85)';

/* ── Floating background formulas ────────────────────────────────────────── */
const FORMULAS = [
  { s: 'e^iθ = cos θ + i·sin θ',   rx: 0.55, ry: 0.10, base: 0.07, spd: 0.18 },
  { s: '∫₀^{2π} sin x dx = 0',     rx: 0.58, ry: 0.88, base: 0.06, spd: 0.23 },
  { s: 'sin²θ + cos²θ = 1',         rx: 0.70, ry: 0.50, base: 0.055, spd: 0.14 },
  { s: 'd/dx sin(x) = cos(x)',      rx: 0.52, ry: 0.72, base: 0.05, spd: 0.19 },
];

/* ── Helpers ─────────────────────────────────────────────────────────────── */
function setGlow(color, blur){
  ctx.shadowColor = color;
  ctx.shadowBlur  = blur * Math.min(W, H) / 500; // scale glow with canvas size
}
function clearGlow(){ ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; }

/* ── Main loop ───────────────────────────────────────────────────────────── */
let t0 = null;

function draw(ts){
  if(!t0) t0 = ts;
  const t     = (ts - t0) * 0.001;
  const omega = 0.5;            // rad/s
  const angle = t * omega;      // current phase

  /* 1 ── Background ──────────────────────────────────────────────────────── */
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  /* 2 ── Grid ────────────────────────────────────────────────────────────── */
  const gs = Math.round(H / 9);
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 0.5;
  for(let x = gs; x < W; x += gs){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y = gs; y < H; y += gs){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  /* 3 ── Floating formulas ───────────────────────────────────────────────── */
  const fsize = Math.max(10, Math.round(H * 0.038));
  ctx.font = `${fsize}px 'DM Mono',monospace`;
  FORMULAS.forEach(f => {
    const pulse = 0.5 + 0.5 * Math.sin(t * f.spd + f.rx * 8);
    ctx.globalAlpha = f.base * (0.6 + 0.4 * pulse);
    ctx.fillStyle = '#fff';
    ctx.fillText(f.s, f.rx * W, f.ry * H);
  });
  ctx.globalAlpha = 1;

  /* 4 ── Geometry ─────────────────────────────────────────────────────────── */
  const cx = W * 0.30;
  const cy = H * 0.50;
  const r  = Math.min(W * 0.20, H * 0.33);

  // Rotating point
  const px = cx + r * Math.cos(angle);
  const py = cy - r * Math.sin(angle);

  // Wave origin (just right of circle) + wavelength
  const x0  = cx + r + Math.round(W * 0.025);
  const wl  = r * Math.PI * 1.3;    // wave length in px
  const k   = (2 * Math.PI) / wl;

  /* 5 ── Cosine wave (pink, draws behind sine) ────────────────────────────── */
  ctx.save();
  setGlow(PINK, 18);
  ctx.strokeStyle = 'rgba(244,114,182,0.55)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  for(let x = x0; x <= W - 12; x++){
    const y = cy - r * Math.cos(angle - k * (x - x0));
    x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();

  /* 6 ── Sine wave (cyan, main) ───────────────────────────────────────────── */
  // Fade-out toward right edge using a clip gradient
  ctx.save();
  // Fade mask via composite
  const fadeW = Math.round(W * 0.18);
  const fadeGrad = ctx.createLinearGradient(W - fadeW, 0, W, 0);
  fadeGrad.addColorStop(0, 'rgba(0,0,0,0)');
  fadeGrad.addColorStop(1, 'rgba(0,0,0,1)');

  setGlow(CYAN, 24);
  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 2.8;
  ctx.beginPath();
  for(let x = x0; x <= W - 12; x++){
    const dist   = (x - x0) / (W - x0);
    const y = cy - r * Math.sin(angle - k * (x - x0));
    x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();

  /* Fade-out overlay on the right edge */
  const edgeFade = ctx.createLinearGradient(W - Math.round(W*0.22), 0, W, 0);
  edgeFade.addColorStop(0, 'rgba(3,3,8,0)');
  edgeFade.addColorStop(1, 'rgba(3,3,8,1)');
  ctx.fillStyle = edgeFade;
  ctx.fillRect(0, 0, W, H);

  /* 7 ── Circle axes ──────────────────────────────────────────────────────── */
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 7]);
  ctx.beginPath();
  ctx.moveTo(cx - r * 1.25, cy); ctx.lineTo(cx + r * 1.25, cy);
  ctx.moveTo(cx, cy - r * 1.25); ctx.lineTo(cx, cy + r * 1.25);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  /* 8 ── Projection lines ─────────────────────────────────────────────────── */
  ctx.save();
  ctx.lineWidth = 1.2;
  ctx.setLineDash([3, 6]);
  // sin projection: vertical from point down to x-axis
  setGlow(CYAN, 8);
  ctx.strokeStyle = 'rgba(34,211,238,0.35)';
  ctx.beginPath();
  ctx.moveTo(px, py); ctx.lineTo(px, cy);
  ctx.stroke();
  // cos projection: horizontal from point to y-axis
  setGlow(PINK, 8);
  ctx.strokeStyle = 'rgba(244,114,182,0.35)';
  ctx.beginPath();
  ctx.moveTo(px, py); ctx.lineTo(cx, py);
  ctx.stroke();
  // Connector from rotating point to wave start
  setGlow(CYAN, 6);
  ctx.strokeStyle = 'rgba(34,211,238,0.25)';
  ctx.beginPath();
  ctx.moveTo(px, py); ctx.lineTo(x0, py);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  /* 9 ── Unit circle ───────────────────────────────────────────────────────── */
  ctx.save();
  setGlow(PURPLE, 20);
  ctx.strokeStyle = 'rgba(168,85,247,0.65)';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  /* 10 ── Phasor ───────────────────────────────────────────────────────────── */
  ctx.save();
  setGlow(PURPLE, 28);
  ctx.strokeStyle = PURPLE;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(px, py);
  ctx.stroke();
  ctx.restore();

  /* 11 ── Theta arc + label ────────────────────────────────────────────────── */
  const normAngle = ((angle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  if(normAngle > 0.08){
    ctx.save();
    const arcR = r * 0.24;
    setGlow(PURPLE, 10);
    ctx.strokeStyle = 'rgba(168,85,247,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, arcR, -normAngle, 0);
    ctx.stroke();
    ctx.fillStyle = 'rgba(200,160,255,0.75)';
    ctx.font = `${Math.max(11, Math.round(H*0.028))}px serif`;
    const labelAngle = -normAngle / 2;
    ctx.fillText('θ', cx + arcR * 1.55 * Math.cos(labelAngle), cy + arcR * 1.55 * Math.sin(labelAngle));
    ctx.restore();
  }

  /* 12 ── Axis labels ─────────────────────────────────────────────────────── */
  const lblSize = Math.max(9, Math.round(H * 0.028));
  ctx.save();
  ctx.font = `${lblSize}px 'DM Mono',monospace`;
  ctx.fillStyle = 'rgba(34,211,238,0.45)';
  ctx.fillText('sin θ', x0 + 6, cy - r * 0.6);
  ctx.fillStyle = 'rgba(244,114,182,0.4)';
  ctx.fillText('cos θ', cx + 4, cy - r * 0.88);
  ctx.restore();

  /* 13 ── Glowing dots ─────────────────────────────────────────────────────── */
  function dot(x, y, color, size, glowBlur){
    ctx.save();
    setGlow(color, glowBlur);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // Origin
  dot(cx, cy, 'rgba(255,255,255,0.6)', 2.5, 12);
  // cos foot (on x-axis)
  dot(px, cy, 'rgba(34,211,238,0.7)', 3, 14);
  // sin foot (on y-axis — the py position)
  dot(cx, py, 'rgba(244,114,182,0.7)', 3, 14);
  // Rotating point — bright white with purple halo
  dot(px, py, WHITE, 5.5, 32);
  // Wave start
  dot(x0, py, CYAN, 4.5, 26);

  /* 14 ── Sine peak/trough markers ────────────────────────────────────────── */
  // Dots at peaks and troughs of the visible sine wave
  const quarterWl = wl / 4;
  const firstPeakOffset = ((angle % wl) + wl) % wl; // offset to next peak from wave start
  for(let off = firstPeakOffset; off < W - x0; off += wl / 2){
    const xd = x0 + off;
    if(xd < W * 0.82){
      const yd = cy - r * Math.sin(angle - k * off);
      const alpha = 0.5 * (1 - off / (W - x0));
      ctx.save();
      setGlow(CYAN, 16);
      ctx.fillStyle = `rgba(34,211,238,${alpha.toFixed(2)})`;
      ctx.beginPath();
      ctx.arc(xd, yd, 3, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
