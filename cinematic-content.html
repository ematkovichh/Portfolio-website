<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#03030a;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;

function resize(){
  W = canvas.width  = canvas.offsetWidth  * Math.min(devicePixelRatio, 2);
  H = canvas.height = canvas.offsetHeight * Math.min(devicePixelRatio, 2);
}
window.addEventListener('resize', resize);
resize();

const TRACKS = [
  { label:'VIDEO', clips:[{s:.03,e:.28,note:'wide shot'},{s:.31,e:.62,note:'close up'},{s:.65,e:.93,note:'b-roll'}], color:'rgba(220,220,235,' },
  { label:'AUDIO', clips:[{s:.01,e:.44,note:'dialogue'},{s:.47,e:.88,note:'ambient'}],                               color:'rgba(180,180,200,' },
  { label:'VFX',   clips:[{s:.06,e:.22,note:'grade'},{s:.38,e:.60,note:'title'},{s:.70,e:.91,note:'fade'}],          color:'rgba(150,150,170,' },
];

let t = 0;

function draw(){
  requestAnimationFrame(draw);
  t += 0.0015;
  const ph = t % 1;

  ctx.fillStyle = '#03030a';
  ctx.fillRect(0, 0, W, H);

  const pad   = W * .07;
  const rulerY = H * .18;
  const trackStart = rulerY + H * .06;
  const trackH = H * .10;
  const trackGap = H * .055;
  const timeW  = W - pad * 2;

  /* ── ruler ticks ── */
  for(let i = 0; i <= 10; i++){
    const x = pad + (timeW * i / 10);
    const tall = i % 5 === 0;
    ctx.fillStyle = tall ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.05)';
    ctx.fillRect(x, rulerY, 1, tall ? H * .028 : H * .016);
  }

  /* ── tracks ── */
  TRACKS.forEach((track, ti) => {
    const ty = trackStart + ti * (trackH + trackGap);

    /* track label */
    ctx.font = `300 ${W*.018}px 'DM Mono','Courier New',monospace`;
    ctx.fillStyle = 'rgba(255,255,255,.2)';
    ctx.textBaseline = 'middle';
    ctx.fillText(track.label, 0, ty + trackH * .5);

    /* track background lane */
    ctx.fillStyle = 'rgba(255,255,255,.03)';
    ctx.fillRect(pad, ty, timeW, trackH);

    track.clips.forEach(clip => {
      const cx = pad + clip.s * timeW;
      const cw = (clip.e - clip.s) * timeW;

      /* clip fill */
      ctx.fillStyle = track.color + '.13)';
      ctx.fillRect(cx, ty, cw, trackH);

      /* top edge */
      ctx.fillStyle = track.color + '.7)';
      ctx.fillRect(cx, ty, cw, 1.5);

      /* left cap */
      ctx.fillStyle = track.color + '.55)';
      ctx.fillRect(cx, ty, 2, trackH);

      /* note label */
      if(cw > W * .06){
        ctx.save();
        ctx.rect(cx + 6, ty, cw - 10, trackH);
        ctx.clip();
        ctx.font = `300 ${W*.018}px 'DM Mono','Courier New',monospace`;
        ctx.fillStyle = track.color + '.65)';
        ctx.textBaseline = 'middle';
        ctx.fillText(clip.note, cx + 8, ty + trackH * .5);
        ctx.restore();
      }
    });
  });

  /* ── playhead ── */
  const phX = pad + ph * timeW;

  /* soft glow behind playhead */
  const glowW = W * .018;
  const glowGrd = ctx.createLinearGradient(phX - glowW, 0, phX + glowW, 0);
  glowGrd.addColorStop(0,   'rgba(255,255,255,0)');
  glowGrd.addColorStop(0.5, 'rgba(255,255,255,.04)');
  glowGrd.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = glowGrd;
  ctx.fillRect(phX - glowW, rulerY, glowW * 2, H * .78);

  /* playhead line */
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillRect(phX, rulerY, 1, H * .78);

  /* playhead head triangle */
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.beginPath();
  ctx.moveTo(phX - 4, rulerY);
  ctx.lineTo(phX + 4, rulerY);
  ctx.lineTo(phX, rulerY + H * .022);
  ctx.closePath();
  ctx.fill();

  /* ── timecode ── */
  const secs = (ph * 90) | 0;
  const tc = `${String((secs / 60) | 0).padStart(2,'0')}:${String(secs % 60).padStart(2,'0')}`;
  ctx.font = `300 ${W * .028}px 'DM Mono','Courier New',monospace`;
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'right';
  ctx.fillText(tc, W - pad, H * .09);
  ctx.textAlign = 'left';
}

draw();
</script>
</body>
</html>
